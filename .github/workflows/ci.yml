name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Nothing here downloads SciFact or a model: the offline suite runs on fakes and fixtures,
# and the container is checked on the demo backend, whose policy is fitted at startup.
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UV_FROZEN: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.5"
          python-version: "3.12"
          enable-cache: true
      - name: ruff check and ruff format --check
        run: uv run ruff check . && uv run ruff format --check .
      - name: offline pytest (metric parity fixture, policy properties, API contract)
        run: uv run pytest
      - name: CLI abstains on a claim the demo corpus cannot decide
        run: |
          uv run crag-verifier verify --backend demo "Saffron extract improves memory in children." > out.json
          python3 -c "import json; r = json.load(open('out.json')); assert r['abstained'] and r['verdict'] == 'NOINFO', r"

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: offline
    steps:
      - uses: actions/checkout@v4
      - name: docker build
        run: docker build --tag crag-verifier:ci .
      - name: start on the demo backend and wait for the health probe
        run: |
          docker run --detach --name crag --publish 8000:8000 \
            --env CRAG_VERIFIER_BACKEND=demo crag-verifier:ci
          for _ in $(seq 1 60); do
            health=$(docker inspect --format '{{.State.Health.Status}}' crag)
            [ "$health" = healthy ] && break
            sleep 2
          done
          echo "health: $health"
          [ "$health" = healthy ]
          [ "$(docker exec crag id -u)" = 10001 ]
      - name: refine, abstain and re-retrieve paths, 422 and 413
        run: python3 .github/container_smoke.py http://localhost:8000
      - name: container log
        if: always()
        run: docker logs crag || true
