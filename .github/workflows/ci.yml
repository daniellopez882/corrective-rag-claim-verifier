name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Tests (default suite, no network, no datasets)
        run: uv run pytest

  docker:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t crag-verifier:ci .
      - name: Smoke run on the demo backend
        run: |
          docker run -d --name crag -p 8000:8000 -e CRAG_VERIFIER_BACKEND=demo crag-verifier:ci
          status=starting
          for _ in $(seq 1 60); do
            status=$(docker inspect -f '{{.State.Health.Status}}' crag)
            [ "$status" = healthy ] && break
            sleep 2
          done
          echo "health: $status"
          test "$status" = healthy
          test "$(docker exec crag id -u)" = 10001
          curl -fsS -X POST localhost:8000/verify \
            -H 'content-type: application/json' \
            -d '{"claim": "Strain K4 degrades polyethylene film."}' > verify.json
          python3 -c "import json; r = json.load(open('verify.json')); assert r['verdict'] in {'SUPPORT', 'CONTRADICT', 'NOINFO'}; print(r['verdict'], r['action'], r['evaluator_confidence'])"
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8000/verify -H 'content-type: application/json' -d '{"claim": ""}')
          test "$code" = 422
      - name: Container logs
        if: always()
        run: docker logs crag || true
