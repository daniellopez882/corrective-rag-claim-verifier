[project]
name = "corrective-rag-claim-verifier"
version = "0.1.0"
description = "Corrective RAG for SciFact claim verification: a calibrated retrieval evaluator triages each claim into refine, re-retrieve or abstain."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Daniel Lopez" }]
keywords = ["corrective-rag", "claim-verification", "scifact", "calibration", "fastapi"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.9",
    "numpy>=2.1",
    "onnxruntime>=1.20",
    "tokenizers>=0.20",
    "huggingface-hub>=0.26",
    "httpx>=0.27",
]

[project.scripts]
crag-verifier = "crag_verifier.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "hypothesis>=6.115",
    "ruff>=0.7",
    "scikit-learn>=1.5",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crag_verifier"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PTH"]
ignore = ["RUF001", "RUF002", "RUF003", "SIM905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not integration'"
markers = [
    "integration: needs the fetched SciFact data, the official evaluator or the ONNX models",
]
